<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Wavefinger</title>
<style>
  :root{
    --bg: #0a0a0c;
    --panel: #131316;
    --panel-border: #232328;
    --ink: #e8e6e1;
    --ink-dim: #8a8886;
    --accent: #ff5b3c;
    --grid-line: rgba(255,255,255,0.06);
    --grid-line-strong: rgba(255,255,255,0.11);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    width: 100%;
  }

  /* ---------- Header ---------- */
  header {
    flex: 0 0 auto;
    padding: max(14px, env(safe-area-inset-top)) 18px 10px 18px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--ink);
  }
  header .sub {
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.01em;
  }

  /* ---------- Canvas area ---------- */
  #canvasWrap {
    flex: 1 1 auto;
    position: relative;
    margin: 0 12px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--panel-border);
    background: #08080a;
  }
  canvas { display: block; width: 100%; height: 100%; }

  #hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
    color: var(--ink-dim);
    font-size: 13px;
    line-height: 1.6;
    padding: 0 40px;
    transition: opacity 0.4s ease;
  }
  #hint b { color: var(--ink); font-weight: 600; }

  /* axis labels */
  .axisLabel {
    position: absolute;
    font-size: 10px;
    color: var(--ink-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    pointer-events: none;
  }
  .axisLabel.top { top: 8px; left: 50%; transform: translateX(-50%); }
  .axisLabel.bottom { bottom: 8px; left: 50%; transform: translateX(-50%); }
  .axisLabel.left { left: 8px; top: 50%; transform: translateY(-50%) rotate(-90deg); transform-origin: left top; }
  .axisLabel.right { right: 8px; top: 50%; transform: translateY(-50%); text-align: right; }

  /* ---------- Bottom control dock ---------- */
  #dock {
    flex: 0 0 auto;
    padding: 12px 12px max(12px, env(safe-area-inset-bottom)) 12px;
  }

  .row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  button.action {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--ink);
    border-radius: 10px;
    padding: 11px 8px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  button.action:active { background: #1b1b1f; }
  button.action.danger { color: #ff8c78; }

  #settingsToggle {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--ink-dim);
    border-radius: 10px;
    padding: 10px;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    letter-spacing: 0.02em;
  }
  #settingsToggle .chev { transition: transform 0.25s ease; font-size: 10px; }
  #settingsToggle.open .chev { transform: rotate(180deg); }

  #settingsPanel {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.28s ease;
  }
  #settingsPanel.open { max-height: 520px; }

  .panelInner {
    padding-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .field label {
    display: block;
    font-size: 11px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  .field label .val { color: var(--ink); text-transform: none; letter-spacing: 0; float: right; }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: var(--panel-border);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--ink);
    border: 3px solid var(--bg);
    box-shadow: 0 0 0 1px var(--panel-border);
  }

  .swatchRow { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch {
    width: 40px; height: 40px;
    border-radius: 10px;
    border: 2px solid transparent;
    position: relative;
    flex: 0 0 auto;
  }
  .swatch.selected { border-color: var(--ink); }
  .swatch[data-c="orange"] { background: #ff5b3c; }
  .swatch[data-c="cyan"] { background: #34e0d6; }
  .swatch[data-c="violet"] { background: #9b6bff; }
  .swatch[data-c="lime"] { background: #b6ff3c; }
  .swatch[data-c="pink"] { background: #ff5ba0; }
  .swatch[data-c="white"] { background: #f2f2f2; }
  .swatch[data-c="rainbow"] {
    background: conic-gradient(red, orange, yellow, lime, cyan, blue, violet, red);
  }

  .segRow { display: flex; gap: 6px; }
  .seg {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--ink-dim);
    border-radius: 8px;
    padding: 9px 4px;
    font-size: 12px;
    text-align: center;
  }
  .seg.selected {
    background: #1c1c20;
    color: var(--ink);
    border-color: #38383e;
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div>
      <h1>Wavefinger</h1>
    </div>
    <div class="sub" id="instrumentLabel">Sine</div>
  </header>

  <div id="canvasWrap">
    <canvas id="pad"></canvas>
    <div class="axisLabel top">higher pitch</div>
    <div class="axisLabel bottom">lower pitch</div>
    <div class="axisLabel left">quiet</div>
    <div class="axisLabel right">full volume</div>
    <div id="hint">Drag your finger across the pad.<br><b>Up / down</b> changes pitch. <b>Left / right</b> changes volume.</div>
  </div>

  <div id="dock">
    <div class="row">
      <button class="action danger" id="clearBtn">Clear trails</button>
      <button class="action" id="settingsBtnTop" style="display:none;"></button>
    </div>

    <div id="settingsToggle">
      <span>Customize</span>
      <span class="chev">▾</span>
    </div>

    <div id="settingsPanel">
      <div class="panelInner">

        <div class="field">
          <label>Grid size <span class="val" id="gridVal">10 × 14</span></label>
          <input type="range" id="gridSlider" min="4" max="24" step="1" value="10">
        </div>

        <div class="field">
          <label>Trail color</label>
          <div class="swatchRow" id="colorSwatches">
            <div class="swatch selected" data-c="orange"></div>
            <div class="swatch" data-c="cyan"></div>
            <div class="swatch" data-c="violet"></div>
            <div class="swatch" data-c="lime"></div>
            <div class="swatch" data-c="pink"></div>
            <div class="swatch" data-c="white"></div>
            <div class="swatch" data-c="rainbow"></div>
          </div>
        </div>

        <div class="field">
          <label>Instrument</label>
          <div class="segRow" id="instrumentSeg">
            <div class="seg selected" data-i="sine">Sine</div>
            <div class="seg" data-i="triangle">Triangle</div>
            <div class="seg" data-i="square">Square</div>
            <div class="seg" data-i="sawtooth">Saw</div>
            <div class="seg" data-i="pluck">Pluck</div>
          </div>
        </div>

        <div class="field">
          <label>Pitch range</label>
          <div class="segRow" id="rangeSeg">
            <div class="seg" data-r="low">Low</div>
            <div class="seg selected" data-r="mid">Mid</div>
            <div class="seg" data-r="high">High</div>
            <div class="seg" data-r="wide">Wide</div>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ---------- Canvas setup ----------
  const canvas = document.getElementById('pad');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('canvasWrap');
  const hint = document.getElementById('hint');

  let dpr = Math.max(1, window.devicePixelRatio || 1);
  let W = 0, H = 0;

  function resize(){
    const r = wrap.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    drawGrid();
  }
  window.addEventListener('resize', resize);

  // ---------- State ----------
  const state = {
    gridCols: 10,
    gridRows: 14,
    color: 'orange',
    instrument: 'sine',
    range: 'mid'
  };

  const colorHex = {
    orange: '#ff5b3c',
    cyan: '#34e0d6',
    violet: '#9b6bff',
    lime: '#b6ff3c',
    pink: '#ff5ba0',
    white: '#f2f2f2'
  };

  const rangeMap = {
    low:  { min: 55,  max: 440 },   // A1 - A4
    mid:  { min: 130, max: 1046 },  // C3 - C6
    high: { min: 440, max: 2637 },  // A4 - E7
    wide: { min: 40,  max: 3520 }   // E1 - A7
  };

  // ---------- Grid drawing ----------
  function drawGrid(){
    ctx.clearRect(0,0,W,H);
    const cols = state.gridCols;
    const rows = Math.round(cols * 1.4);
    state.gridRows = rows;
    document.getElementById('gridVal').textContent = cols + ' × ' + rows;

    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-line');
    ctx.lineWidth = 1;
    for(let c=1;c<cols;c++){
      const x = (c/cols)*W;
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    }
    for(let r=1;r<rows;r++){
      const y = (r/rows)*H;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }
    // center line slightly stronger
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-line-strong');
    const midY = H/2;
    ctx.beginPath(); ctx.moveTo(0,midY); ctx.lineTo(W,midY); ctx.stroke();
  }

  // ---------- Audio ----------
  let actx = null;
  let master = null;
  const voices = new Map(); // pointerId -> {osc, gain, filter?}

  function ensureAudio(){
    if(!actx){
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain();
      master.gain.value = 0.9;
      master.connect(actx.destination);
    }
    if(actx.state === 'suspended') actx.resume();
  }

  function freqFromY(yNorm){
    // yNorm: 0 (top) = high pitch, 1 (bottom) = low pitch
    const r = rangeMap[state.range];
    const t = 1 - yNorm; // invert so up = high
    // log scale for musical feel
    const logMin = Math.log(r.min), logMax = Math.log(r.max);
    return Math.exp(logMin + t*(logMax - logMin));
  }

  function volFromX(xNorm){
    // xNorm 0 = quiet, 1 = full
    return Math.max(0.0001, xNorm * xNorm); // curve for perceptual feel
  }

  function makeVoice(){
    const gain = actx.createGain();
    gain.gain.value = 0;
    gain.connect(master);

    if(state.instrument === 'pluck'){
      // simple plucked-string-ish: short decay triangle + noise burst
      const osc = actx.createOscillator();
      osc.type = 'triangle';
      const filter = actx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 2200;
      osc.connect(filter);
      filter.connect(gain);
      osc.start();
      return { osc, gain, filter, isPluck: true };
    } else {
      const osc = actx.createOscillator();
      osc.type = state.instrument;
      osc.connect(gain);
      osc.start();
      return { osc, gain };
    }
  }

  function updateVoice(v, freq, vol){
    const now = actx.currentTime;
    v.osc.frequency.setTargetAtTime(freq, now, 0.02);
    if(v.isPluck){
      // gentle envelope-ish behavior while dragging: retrigger amplitude slightly
      v.gain.gain.setTargetAtTime(vol*0.8, now, 0.015);
    } else {
      v.gain.gain.setTargetAtTime(vol*0.6, now, 0.02);
    }
  }

  function killVoice(v){
    const now = actx.currentTime;
    v.gain.gain.setTargetAtTime(0.0001, now, 0.08);
    setTimeout(()=>{
      try{ v.osc.stop(); }catch(e){}
      try{ v.osc.disconnect(); v.gain.disconnect(); if(v.filter) v.filter.disconnect(); }catch(e){}
    }, 300);
  }

  // ---------- Trail drawing ----------
  let hue = 0;
  const paths = new Map(); // pointerId -> last point

  function colorForStroke(pointerId, xNorm){
    if(state.color === 'rainbow'){
      hue = (hue + 2) % 360;
      return `hsl(${hue}, 90%, 62%)`;
    }
    return colorHex[state.color];
  }

  function drawSegment(x0,y0,x1,y1,color,vol){
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineCap = 'round';
    ctx.lineWidth = 2 + vol*10;
    ctx.shadowColor = color;
    ctx.shadowBlur = 8 + vol*14;
    ctx.globalAlpha = 0.5 + vol*0.5;
    ctx.beginPath();
    ctx.moveTo(x0,y0);
    ctx.lineTo(x1,y1);
    ctx.stroke();
    ctx.restore();
  }

  // fade trails slowly
  function fadeLoop(){
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.045)';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
    requestAnimationFrame(fadeLoop);
  }

  // ---------- Pointer handling ----------
  function normFromEvent(e){
    const r = canvas.getBoundingClientRect();
    let x = (e.clientX - r.left) / r.width;
    let y = (e.clientY - r.top) / r.height;
    x = Math.min(1, Math.max(0, x));
    y = Math.min(1, Math.max(0, y));
    return {x,y};
  }

  function onPointerDown(e){
    ensureAudio();
    hint.style.opacity = '0';
    canvas.setPointerCapture(e.pointerId);
    const {x,y} = normFromEvent(e);
    const v = makeVoice();
    voices.set(e.pointerId, v);
    paths.set(e.pointerId, {x,y});
    const freq = freqFromY(y);
    const vol = volFromX(x);
    updateVoice(v, freq, vol);
  }

  function onPointerMove(e){
    if(!voices.has(e.pointerId)) return;
    const {x,y} = normFromEvent(e);
    const last = paths.get(e.pointerId);
    const v = voices.get(e.pointerId);
    const freq = freqFromY(y);
    const vol = volFromX(x);
    updateVoice(v, freq, vol);

    const color = colorForStroke(e.pointerId, x);
    drawSegment(last.x*W, last.y*H, x*W, y*H, color, vol);
    paths.set(e.pointerId, {x,y});
  }

  function onPointerUp(e){
    const v = voices.get(e.pointerId);
    if(v){ killVoice(v); voices.delete(e.pointerId); }
    paths.delete(e.pointerId);
  }

  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('pointerleave', (e)=>{ if(e.pointerType==='mouse') onPointerUp(e); });

  // ---------- Controls ----------
  document.getElementById('clearBtn').addEventListener('click', ()=>{
    ctx.clearRect(0,0,W,H);
    drawGrid();
  });

  const settingsToggle = document.getElementById('settingsToggle');
  const settingsPanel = document.getElementById('settingsPanel');
  settingsToggle.addEventListener('click', ()=>{
    settingsToggle.classList.toggle('open');
    settingsPanel.classList.toggle('open');
  });

  const gridSlider = document.getElementById('gridSlider');
  function applyGridSize(){
    state.gridCols = parseInt(gridSlider.value,10);
    drawGrid();
  }
  gridSlider.addEventListener('input', applyGridSize);
  gridSlider.addEventListener('change', applyGridSize);
  gridSlider.addEventListener('touchend', applyGridSize);

  document.getElementById('colorSwatches').addEventListener('click', (e)=>{
    const sw = e.target.closest('.swatch');
    if(!sw) return;
    document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('selected'));
    sw.classList.add('selected');
    state.color = sw.dataset.c;
  });

  const instrumentLabel = document.getElementById('instrumentLabel');
  const instNames = {sine:'Sine', triangle:'Triangle', square:'Square', sawtooth:'Saw', pluck:'Pluck'};
  document.getElementById('instrumentSeg').addEventListener('click', (e)=>{
    const seg = e.target.closest('.seg');
    if(!seg) return;
    document.querySelectorAll('#instrumentSeg .seg').forEach(s=>s.classList.remove('selected'));
    seg.classList.add('selected');
    state.instrument = seg.dataset.i;
    instrumentLabel.textContent = instNames[state.instrument];
  });

  document.getElementById('rangeSeg').addEventListener('click', (e)=>{
    const seg = e.target.closest('.seg');
    if(!seg) return;
    document.querySelectorAll('#rangeSeg .seg').forEach(s=>s.classList.remove('selected'));
    seg.classList.add('selected');
    state.range = seg.dataset.r;
  });

  document.getElementById('settingsBtnTop').remove();

  // ---------- Init ----------
  resize();
  requestAnimationFrame(fadeLoop);

  // prevent iOS bounce/scroll
  document.addEventListener('touchmove', (e)=>{
    if(e.target.tagName === 'INPUT') return;
    e.preventDefault();
  }, {passive:false});
})();
</script>
</body>
</html>
